services:
  api:
    build: .
    container_name: channel-analytics-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app  # hot-reload de código en desarrollo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Descomentar para probar localmente contra Postgres tal como corre en
  # Railway (en vez del SQLite default). Si se descomenta, también hay que
  # descomentar `volumes:` al final del archivo y agregar en el `api`:
  #     environment:
  #       DATABASE_URL: postgresql+asyncpg://analytics:analytics@db:5432/channel_analytics
  #     depends_on:
  #       - db
  # db:
  #   image: postgres:16-alpine
  #   container_name: channel-analytics-db
  #   environment:
  #     POSTGRES_USER: analytics
  #     POSTGRES_PASSWORD: analytics
  #     POSTGRES_DB: channel_analytics
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

