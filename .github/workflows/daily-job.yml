# Este workflow llama a un endpoint HTTP publico de la API para disparar
# el job diario. Si la API SOLO corre local (docker-compose / uvicorn en
# tu PC) este workflow no tiene forma de alcanzarla: los runners de GitHub
# viven en la nube y no pueden resolver un hostname interno como
# "channel-analytics-core" (el container_name de docker-compose), que es
# justo lo que tirό el error "Could not resolve host". Esto pasa tanto con
# el cron automatico como con el boton manual "Run workflow" (workflow_dispatch)
# porque los dos corren el mismo step.
#
# El job diario YA corre solo, sin este workflow, mientras la API este
# levantada en tu maquina: ver app/core/scheduler.py (APScheduler,
# arrancado en el startup de FastAPI). Mientras sigas probando todo local
# en PyCharm (docker-compose / uvicorn) no hace falta nada mas de este
# archivo.
#
# Dejo AMBOS triggers deshabilitados (comentados: `schedule` y
# `workflow_dispatch`) para que este workflow no aparezca ni se pueda
# disparar por error mientras no haya un deploy publico. Cuando deployes
# a Railway (o donde sea), descomentá los dos triggers de abajo y cargá:
#   - Secret APP_BASE_URL: la URL PUBLICA real del deploy
#     (ej: https://tu-proyecto.up.railway.app), NUNCA el nombre de un
#     container de docker-compose.
#   - Secret ADMIN_TOKEN (opcional): si tu endpoint /run-daily-job lo pide.
name: Daily channel tracking job

on: {}
  # schedule:
  #   - cron: "0 3 * * *"
  # workflow_dispatch: {}

jobs:
  run-daily-job:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/v1/tracking/run-daily-job
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "Falta configurar el secret APP_BASE_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          if [ -n "$ADMIN_TOKEN" ]; then
            curl -sS -X POST "$APP_BASE_URL/api/v1/tracking/run-daily-job" \
              -H "X-Admin-Token: $ADMIN_TOKEN" \
              --fail-with-body
          else
            curl -sS -X POST "$APP_BASE_URL/api/v1/tracking/run-daily-job" \
              --fail-with-body
          fi