name: Daily channel tracking job

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  run-daily-job:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/v1/tracking/run-daily-job
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "Falta configurar el secret APP_BASE_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          if [ -n "$ADMIN_TOKEN" ]; then
            curl -sS -X POST "$APP_BASE_URL/api/v1/tracking/run-daily-job" \
              -H "X-Admin-Token: $ADMIN_TOKEN" \
              --fail-with-body
          else
            curl -sS -X POST "$APP_BASE_URL/api/v1/tracking/run-daily-job" \
              --fail-with-body
          fi
